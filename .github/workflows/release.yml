name: Release

on:
  push:
    branches: [main]
  # 手动兜底：用于「先合并了版本 PR、之后才配好 NPM_TOKEN」等场景，
  # 无需为空提交就能把已 bump 的版本发出去（发布仍受 token 守卫限制）。
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 发布流程不可被打断，否则可能出现「已发一半」的状态
  cancel-in-progress: false

permissions:
  contents: write # 提交版本变更 / 打 tag
  pull-requests: write # 创建版本 PR
  id-token: write # npm provenance

jobs:
  release:
    name: 版本 PR / 发布
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          # 会生成带 //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} 的 .npmrc
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      # changesets/action v2 对应 changesets v3。
      # 注意：v2 的 input 已改名（publish -> publish-script 等），传旧名会直接报错；
      # 且它不会把 NPM_TOKEN 映射成 NODE_AUTH_TOKEN，认证必须由 NODE_AUTH_TOKEN 提供。
      - name: Version PR / Publish
        uses: changesets/action@v2
        with:
          # 可选：配置 RELEASE_TOKEN（fine-grained PAT，需 contents:write +
          # pull-requests:write）后，版本 PR 的作者会是你本人，
          # 从而免掉 github-actions[bot] 因「首次贡献者」被卡的 action_required 审批。
          # 未配置时自动回落到默认 github.token，行为不变。
          github-token: ${{ secrets.RELEASE_TOKEN || github.token }}
          version-script: pnpm version-packages
          # 未配置 NPM_TOKEN 时留空：action 只维护版本 PR，不会尝试发布，
          # 从而避免「没有凭证就发 0.0.0 然后失败」。
          publish-script: ${{ secrets.NPM_TOKEN != '' && 'pnpm release' || '' }}
          commit-message: "chore: 发布新版本"
          pr-title: "chore: 发布新版本"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
