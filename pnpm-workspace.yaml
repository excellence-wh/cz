packages:
  - 'apps/*'
  - 'packages/*'

hoistPattern:
  - "*"

publicHoistPattern:
  - "@biomejs/biome"

allowBuilds:
  esbuild: true

peerDependencyRules:

# 仓库内部（apps/ + packages/）共享的 devDependencies 版本。
# 注意：不用于 packages/templates 下的模板素材 —— 模板必须自包含版本号，
# 这样生成出来的项目脱离本仓库也能独立 pnpm install。
catalog:
  '@biomejs/biome': ^2.5.13
  '@changesets/cli': ^3.0.3
  '@types/node': ^26.5.1
  knip: ^6.35.1
  turbo: ^2.10.12
  typescript: ^7.0.2

minimumReleaseAgeExclude:
  - '@changesets/apply-release-plan@8.1.1'
  - '@changesets/cli@3.0.3'
  - '@changesets/config@4.0.1'
